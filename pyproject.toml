[project]
name = "fastapi-mcp-test"
version = "0.1.0"
description = "Estudos sobre FASTAPI + MCP"
readme = "README.md"
authors = [
    { name = "MichaelOli", email = "michaeloliveira38@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "mcp>=2.3.0",
    "uvicorn>=0.54.0",
]

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
